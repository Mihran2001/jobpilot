# A one-node local cluster. Create it with:  pnpm k8s:cluster
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jobpilot
nodes:
  - role: control-plane
    # Pinned (by digest, from kind v0.33.0's release notes) to stay within one
    # minor version of the kubectl Docker Desktop installs (1.34): kubectl
    # supports a skew of one minor version, and kind's default would be 1.37.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # The Envoy Gateway listens on NodePort 30080 inside the cluster;
      # this exposes it as http://localhost:8080 on your Mac, and only there.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
