# Let's Encrypt via cert-manager, using the HTTP-01 challenge served through
# the Gateway's plain-HTTP listener. cert-manager watches the Gateway's
# annotation and keeps the certificate (secret jobpilot-tls) renewed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: jobpilot
                namespace: jobpilot
                kind: Gateway
                sectionName: http
---
# Everything on plain HTTP is redirected to HTTPS (the session cookie is
# Secure). cert-manager's challenge route is more specific, so it still wins
# for /.well-known/acme-challenge/.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
spec:
  parentRefs:
    - name: jobpilot
      sectionName: http
  hostnames: [PUBLIC_HOST]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
