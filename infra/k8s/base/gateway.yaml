# Gateway API (the successor to Ingress), implemented by Envoy Gateway.
# GatewayClass: which controller. Gateway: a listening proxy. HTTPRoute: where
# requests go. How the proxy is exposed (NodePort locally, a cloud load
# balancer on AWS) is the overlay's EnvoyProxy "jobpilot-proxy".
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jobpilot
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: jobpilot-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# Only the web app is reachable from outside. The API is a ClusterIP Service
# that only the web pods call.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: jobpilot
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 3000
