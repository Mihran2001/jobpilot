packages:
  - apps/*
  - packages/*

# pnpm 10 does not run dependency install scripts unless they are listed here.
# Run `pnpm ignored-builds` after adding a dependency to see what was skipped.
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# Reviewed and deliberately not built: an optional native speed-up for
# msgpackr (used by BullMQ); without it msgpackr uses plain JavaScript.
ignoredBuiltDependencies:
  - msgpackr-extract
